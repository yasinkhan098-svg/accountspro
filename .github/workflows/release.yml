name: Build Desktop Installer (Windows & macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Package Windows Installer
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /out:"public\downloads\LedgerX-Setup.exe" /r:System.Windows.Forms.dll /r:System.Drawing.dll "electron\Installer.cs"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-Windows-Setup
          path: public/downloads/LedgerX-Setup.exe

      - name: Publish Windows Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: public/downloads/LedgerX-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Package macOS App Bundle & DMG
        run: |
          node scripts/build-macos-installer.js
          mkdir -p public/downloads
          # Create /Applications symlink inside distribution folder
          ln -s /Applications dist/mac/Applications || true
          # Build Apple UDZO compressed DMG via native hdiutil
          hdiutil create -volname "LedgerX" -srcfolder "dist/mac" -ov -format UDZO "public/downloads/LedgerX-Setup.dmg"
          ls -lh public/downloads/LedgerX-Setup.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-macOS-DMG
          path: public/downloads/LedgerX-Setup.dmg

      - name: Publish macOS Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: public/downloads/LedgerX-Setup.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
