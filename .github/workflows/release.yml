name: Build Desktop Installer (Windows & macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Package Windows Installer
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /out:"public\downloads\LedgerX-Setup.exe" /r:System.Windows.Forms.dll /r:System.Drawing.dll "electron\Installer.cs"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-Windows-Setup
          path: public/downloads/LedgerX-*.exe

      - name: Publish Windows Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/downloads/LedgerX-Setup.exe
            public/downloads/LedgerX-Client-Setup.exe
            public/downloads/LedgerX-Online-Client.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package macOS App Bundles & DMGs
        run: |
          node scripts/build-macos-installer.js
          node scripts/build-macos-clients.js
          mkdir -p public/downloads

          # 1. Main Host & Standalone DMG
          ln -s /Applications dist/mac/Applications || true
          hdiutil create -volname "LedgerX" -srcfolder "dist/mac" -ov -format UDZO "public/downloads/LedgerX-Setup.dmg"

          # 2. Offline LAN Client DMG
          ln -s /Applications dist/mac-client/Applications || true
          hdiutil create -volname "LedgerX-Client" -srcfolder "dist/mac-client" -ov -format UDZO "public/downloads/LedgerX-Client-Setup.dmg"

          # 3. Online Cloud Client DMG
          ln -s /Applications dist/mac-cloud-client/Applications || true
          hdiutil create -volname "LedgerX-Cloud" -srcfolder "dist/mac-cloud-client" -ov -format UDZO "public/downloads/LedgerX-Online-Client.dmg"

          ls -lh public/downloads/*.dmg

      - name: Upload macOS DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-macOS-DMGs
          path: public/downloads/*.dmg

      - name: Publish macOS Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/downloads/LedgerX-Setup.dmg
            public/downloads/LedgerX-Client-Setup.dmg
            public/downloads/LedgerX-Online-Client.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
